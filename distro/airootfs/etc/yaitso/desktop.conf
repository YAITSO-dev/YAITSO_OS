# Горячие клавиши и команды рабочего стола (ycomp).
# terminal / launcher — команды, которые запускаются по сочетаниям.
# hk_* — сочетания клавиш: модификаторы Super, Alt, Ctrl, Shift и клавиша через '+'.

[hotkeys]
terminal     = yterm
launcher     = ylaunch
hk_terminal  = Super+Return
hk_launcher  = Super+d
hk_close     = Super+q
hk_exit      = Super+Shift+q

[bar]
position = top
height   = 28
