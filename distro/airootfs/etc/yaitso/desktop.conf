# Горячие клавиши и оформление рабочего стола (ycomp).
# terminal / launcher — команды, которые запускаются по сочетаниям.
# hk_* — сочетания клавиш: модификаторы Super, Alt, Ctrl, Shift и клавиша через '+'.

[hotkeys]
terminal        = yterm
launcher        = ylaunch
hk_terminal     = Super+Return
hk_launcher     = Super+d
hk_close        = Super+q
hk_exit         = Super+Shift+q
hk_maximize     = Super+m
hk_restore      = Super+Down
hk_snap_left    = Super+Left
hk_snap_right   = Super+Right
hk_minimize     = Super+h
hk_next         = Super+Tab
hk_prev         = Super+Shift+Tab

[appearance]
# Высота панели ybar. Должна совпадать с YBAR_HEIGHT в ybar/ybar.h (28).
bar_height        = 28
background        = #10161f
background_bottom = #23303d

[bar]
position = top
height   = 28
