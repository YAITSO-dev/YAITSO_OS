Утилита `yglibc` управляет запуском и патчингом:

    yglibc info                 — версия и состояние
    yglibc run <cmd> [args]     — запуск через ld-linux-x86-64.so.2
    yglibc patch <binary>       — patchelf --set-interpreter
    yglibc verify <binary>      — проверка ELF-заголовка

## Установка пакетов

`yat` читает поле `libc: glibc` из META пакета. Если оно есть:

1. Проверяет наличие `glibc` в системе.
2. Ставит `glibc` как зависимость.
3. После распаковки запускает `yglibc patch <основной бинарь>`.
4. Регистрирует в `/var/lib/yat/glibc-apps.list`.

Пример: `yat install firefox`.

## NSS

glibc-программы видят `/etc/passwd` через `/usr/glibc/etc/nsswitch.conf`
с `passwd: files`. `libnss_files.so.2` читает файл напрямую.

## Библиотеки в /usr/glibc/lib

- libwayland-client
- libxkbcommon
- libfreetype, libfontconfig
- libdbus-1
- libglib-2.0, libgobject-2.0, libgio-2.0
- libpango-1.0, libpangocairo-1.0
- libnss3, libnspr4
- libsqlite3
- libicu*

## Ограничения

- Только x86_64.
- NSS: passwd/group/shadow — только файлы.
- DNS: libnss_dns через `/etc/resolv.conf`.
- Нет SELinux.

## Добавление своего приложения

    packages/myapp/PKG:
        NAME=myapp
        VERSION=1.0
        LIBC=glibc
        DEPENDS=glibc patchelf
        BUILD_SYSTEM=copy
        BUILD='
        mkdir -p "$STAGE/opt/myapp"
        cp -a "$PKG_DIR/files/." "$STAGE/opt/myapp/"
        yglibc patch "$STAGE/opt/myapp/myapp"
        '

Затем: `make repo-sign` и `yat install myapp`.
