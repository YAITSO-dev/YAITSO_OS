[package]
name = "yat"
version = "0.3.4"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Yaitso OS package manager"

[[bin]]
name = "yat"
path = "src/bin/yat.rs"

[[bin]]
name = "yat-keygen"
path = "src/bin/yat-keygen.rs"

[[bin]]
name = "yat-sign"
path = "src/bin/yat-sign.rs"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
tar = "0.4"
flate2 = "1.0"
walkdir = "2.5"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
